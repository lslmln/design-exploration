<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Verify your email — restyled into Spotify</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --canvas: #121212; --surface2: #282828; --divider: #2A2A2A;
    --text-secondary: #B3B3B3; --text-tertiary: #6A6A6A;
    --green: #1DB954;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--canvas);
    color: #FFFFFF;
    width: 393px;
    margin: 0 auto;
    padding: 24px 24px 32px;
  }
  .backlink { display: block; font-size: 12px; color: var(--text-tertiary); text-decoration: none; margin-bottom: 24px; }

  .step-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .step-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .step-count { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .progress-track { height: 4px; border-radius: 500px; background: var(--surface2); overflow: hidden; margin-bottom: 32px; }
  .progress-fill { height: 4px; width: 100%; border-radius: 500px; background: var(--green); }

  h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; text-align: center; }
  .subtitle { font-size: 14px; font-weight: 400; color: var(--text-secondary); margin: 0 0 28px; text-align: center; }

  .field { margin-bottom: 20px; }
  .field input {
    width: 100%; height: 44px; border-radius: 6px; border: none;
    background: #FFFFFF; color: #121212; font-size: 18px; font-family: inherit;
    text-align: center; letter-spacing: 4px; font-weight: 600;
  }

  .btn { width: 100%; height: 48px; border: none; border-radius: 500px;
    font-family: inherit; font-size: 16px; font-weight: 700; background: var(--green); color: #000000; }
  .resend { display: block; text-align: center; font-size: 13px; font-weight: 600; color: var(--green); margin-top: 20px; text-decoration: none; }
</style>
</head>
<body>
  <a class="backlink" href="index.html">← Back to comparison</a>

  <div class="step-row">
    <div class="step-label">Verify your email</div>
    <div class="step-count">2 of 2</div>
  </div>
  <div class="progress-track"><div class="progress-fill"></div></div>

  <h1>Enter your code</h1>
  <div class="subtitle">We've sent a verification code to your email</div>

  <div class="field">
    <input type="text" placeholder="• • • • • •" />
  </div>

  <button class="btn">Create account</button>
  <a class="resend" href="#">Send a new code</a>
</body>
</html>
