<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Create account — restyled into Spotify</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --canvas: #121212; --surface2: #282828; --divider: #2A2A2A;
    --text-secondary: #B3B3B3; --text-tertiary: #6A6A6A;
    --green: #1DB954; --green-pressed: #169C46;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--canvas);
    color: #FFFFFF;
    width: 393px;
    margin: 0 auto;
    padding: 24px 24px 32px;
  }
  .backlink { display: block; font-size: 12px; color: var(--text-tertiary); text-decoration: none; margin-bottom: 24px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; margin: 0 0 8px; }
  .subtitle { font-size: 15px; font-weight: 400; color: var(--text-secondary); margin: 0 0 28px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .field input {
    width: 100%; height: 44px; border-radius: 6px; border: none;
    background: #FFFFFF; color: #121212; font-size: 16px; font-family: inherit;
    padding: 0 12px;
  }
  .field input::placeholder { color: #6A6A6A; }

  .btn {
    width: 100%; height: 48px; border: none; border-radius: 500px;
    font-family: inherit; font-size: 16px; font-weight: 700;
    margin-top: 12px;
  }
  .btn-primary { background: var(--green); color: #000000; }

  .fine-print { font-size: 12px; color: var(--text-tertiary); margin-top: 20px; line-height: 1.5; }
  .fine-print a { color: var(--text-secondary); }
</style>
</head>
<body>
  <a class="backlink" href="index.html">← Back to comparison</a>
  <h1>Create your account</h1>
  <div class="subtitle">We'll send a code to verify it's you.</div>

  <div class="field">
    <label>EMAIL ADDRESS</label>
    <input type="email" placeholder="you@example.com" />
  </div>
  <div class="field">
    <label>PHONE NUMBER</label>
    <input type="tel" placeholder="(650) 000-0000" />
  </div>

  <button class="btn btn-primary">Sign up</button>

  <div class="fine-print">
    By continuing, you agree to Spotify's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
  </div>
</body>
</html>
