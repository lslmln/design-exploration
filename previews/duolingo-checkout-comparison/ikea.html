<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Where would you like to pick up? — restyled into Duolingo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --green: #58CC02; --green-shadow: #58A700;
    --eel: #4B4B4B; --hare: #AFAFAF; --swan: #E5E5E5;
    --macaw: #1CB0F6; --tile-selected-fill: #DDF4FF; --tile-selected-border: #84D8FF;
    --canvas: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Nunito, -apple-system, system-ui, sans-serif;
    background: var(--canvas);
    width: 393px;
    margin: 0 auto;
    padding: 24px 16px 32px;
  }
  .backlink { display: block; font-size: 12px; color: var(--hare); text-decoration: none; margin-bottom: 16px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; color: var(--eel); margin: 0 0 20px; line-height: 1.25; }

  .card { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 2px solid var(--swan); }
  .card.selected { background: var(--tile-selected-fill); border-color: var(--tile-selected-border); }
  .card-title { font-size: 16px; font-weight: 700; color: var(--eel); margin-bottom: 4px; }
  .card-sub { font-size: 13px; font-weight: 600; color: var(--hare); }
  .check { color: var(--macaw); font-size: 20px; }

  .summary-row { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 24px; }
  .summary-label { font-size: 16px; font-weight: 700; color: var(--eel); }
  .summary-value { font-size: 20px; font-weight: 800; color: var(--eel); }

  .btn { width: 100%; border: none; border-radius: 16px; font-family: inherit; font-weight: 800;
    font-size: 15px; letter-spacing: 0.3px; text-transform: uppercase; height: 56px; }
  .btn-primary { background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-shadow); }
</style>
</head>
<body>
  <a class="backlink" href="index.html">← Back to comparison</a>
  <h1>Where would you like to pick up?</h1>

  <div class="card selected">
    <div><div class="card-title">IKEA East Palo Alto</div><div class="card-sub">1700 East Bayshore Road</div></div>
    <span class="check">✓</span>
  </div>
  <div class="card">
    <div><div class="card-title">IKEA Colma, CA Pick-up point</div><div class="card-sub">35 Colma Blvd.</div></div>
  </div>
  <div class="card">
    <div><div class="card-title">IKEA Market Street</div><div class="card-sub">440 Stevenson Street</div></div>
  </div>

  <div class="summary-row"><div class="summary-label">Total</div><div class="summary-value">$5.29</div></div>
  <button class="btn btn-primary">Continue</button>
</body>
</html>
