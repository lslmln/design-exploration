<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Check your email — restyled into Linear</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #5e6ad2;
    --ink: #f7f8f8;
    --ink-subtle: #8a8f98;
    --canvas: #010102;
    --surface-1: #0f1011;
    --surface-2: #141516;
    --hairline: #23252a;
    --hairline-strong: #34343a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Inter, -apple-system, system-ui, sans-serif;
    background: var(--canvas);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .auth-card {
    width: 380px;
    display: flex; flex-direction: column; gap: 20px; align-items: center; text-align: center;
  }
  h1 { font-size: 20px; font-weight: 400; letter-spacing: -0.2px; margin: 0; color: var(--ink); }
  .subhead { font-size: 14px; color: var(--ink-subtle); margin: -12px 0 0; line-height: 1.5; }
  .icon-circle {
    width: 40px; height: 40px; border-radius: 9999px;
    background: var(--surface-2); display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  input {
    width: 100%; background: var(--surface-1); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 8px 12px; font-size: 16px; color: var(--ink); font-family: inherit;
  }
  input::placeholder { color: var(--ink-subtle); }
  input:focus { outline: none; border-color: var(--hairline-strong); box-shadow: 0 0 0 2px rgba(94,106,210,0.5); }
  .btn-primary {
    width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 14px; font-weight: 500; font-family: inherit; height: 40px;
  }
  .backlink {
    position: fixed; top: 20px; left: 20px;
    font-size: 12px; color: #62666d; text-decoration: none;
    font-family: Inter, sans-serif;
  }
  .backlink:hover { color: var(--ink-subtle); }
</style>
</head>
<body>
  <a class="backlink" href="index.html">← Back to comparison</a>
  <div class="auth-card">
    <div class="icon-circle">✉</div>
    <h1>Check your email</h1>
    <div class="subhead">A temporary sign-in link has been sent to your email address.</div>
    <input placeholder="Enter code" />
    <button class="btn-primary">Continue</button>
  </div>
</body>
</html>
